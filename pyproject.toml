[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwp-manage"
version = "1.0.0"
description = "Reproducible HWPX unit/book merging, integrity checks, and submission packaging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "lxml>=4.9,<7",
]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.23,<2"]
dev = ["pytest>=8,<9"]
all = ["PyMuPDF>=1.23,<2", "pytest>=8,<9"]

[project.scripts]
hwp-manage = "hwp_manage.cli:main"

[tool.setuptools.packages.find]
include = ["hwp_manage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
